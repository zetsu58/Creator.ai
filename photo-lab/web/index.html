<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Creator AI Photo Lab</title><link rel="stylesheet" href="styles.css"></head><body><main><header><div><small>CREATOR AI</small><h1>Photo Lab</h1></div><span class="privacy">● Private</span></header><section class="stage"><input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden><button id="picker" class="canvas"><img id="preview" alt=""><div id="empty"><b>Fotoğraf seç</b><span>JPG, PNG veya WebP</span></div></button><div class="compare" id="compare">Önce ↔ Sonra</div></section><section class="tools"><button data-op="smart_enhance" class="active">✦<span>AUTO</span></button><button data-op="erase">⌫<span>SİL</span></button><button data-op="upscale">↑<span>4K</span></button><button data-op="face_preserve">◎<span>YÜZ</span></button><button data-op="restore">◇<span>ONAR</span></button></section><section class="panel"><label>Kalite<select id="preset"><option value="full_hd">Full HD</option><option value="2k">2K</option><option value="4k">4K</option><option value="original">Orijinal</option></select></label><label>Güç <input id="strength" type="range" min="0" max="100" value="65"></label><label class="toggle"><input id="face" type="checkbox" checked> Yüzü koru</label><button id="run" class="primary" disabled>✦ Profesyonel İyileştir</button><div id="status"></div></section></main><script src="app.js"></script></body></html>
