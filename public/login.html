<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veyra AI - Giriş</title><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#090b10;color:#fff}*{box-sizing:border-box}a{color:inherit;text-decoration:none}.wrap{max-width:620px;margin:auto;padding:28px}.card{margin-top:46px;background:#12151d;border:1px solid #252a36;border-radius:24px;padding:28px}.tabs{display:flex;background:#0d1016;border-radius:14px;padding:4px;margin:20px 0}.tab{flex:1;border:0;border-radius:11px;padding:12px;background:transparent;color:#9aa2b2;font-weight:800}.tab.active{background:#232838;color:#fff}.field{width:100%;padding:14px;margin:8px 0;border:1px solid #303746;border-radius:13px;background:#0d1016;color:#fff;font-size:16px}.btn{width:100%;padding:14px;border:0;border-radius:14px;background:#7c4dff;color:white;font-weight:800;cursor:pointer;margin-top:10px;font-size:16px}.social{background:#fff;color:#15171c;display:flex;align-items:center;justify-content:center;gap:10px}.apple{background:#050505;color:#fff;border:1px solid #343844}.guest{background:#232838}.muted{color:#9aa2b2;line-height:1.5}.ok{color:#65e6a8}.err{color:#ff8181}.divider{display:flex;align-items:center;gap:12px;color:#707789;margin:20px 0}.divider:before,.divider:after{content:'';height:1px;background:#2a2f3b;flex:1}.hidden{display:none}.brand{font-weight:900;font-size:23px}.tiny{font-size:12px;color:#747c8e;margin-top:14px}.status{min-height:24px}</style></head><body><div class="wrap"><a class="brand" href="/">VEYRA AI</a><div class="card"><h1 id="title">Veyra AI’ye giriş</h1><p class="muted">Projelerine, kredilerine ve AI üretim geçmişine güvenli şekilde eriş.</p><div class="tabs"><button id="loginTab" class="tab active">Giriş Yap</button><button id="registerTab" class="tab">Kayıt Ol</button></div><div id="nameRow" class="hidden"><input id="name" class="field" placeholder="Ad soyad" autocomplete="name"></div><input id="email" class="field" type="email" placeholder="E-posta adresi" autocomplete="email"><input id="password" class="field" type="password" placeholder="Şifre (en az 8 karakter)" autocomplete="current-password"><button id="emailSubmit" class="btn">Giriş Yap</button><div class="divider">veya</div><button id="google" class="btn social"><span>G</span> Google ile devam et</button><button id="apple" class="btn apple"><span>●</span> Apple ile devam et</button><button id="guest" class="btn guest">Misafir olarak devam et</button><p id="status" class="status muted"></p><p class="tiny">Devam ederek Veyra AI kullanım koşullarını ve gizlilik politikasını kabul etmiş olursun.</p></div></div><script type="module">const $=s=>document.querySelector(s);let mode='login';let firebase=null;function setMode(next){mode=next;const reg=mode==='register';$('#loginTab').classList.toggle('active',!reg);$('#registerTab').classList.toggle('active',reg);$('#nameRow').classList.toggle('hidden',!reg);$('#title').textContent=reg?'Veyra AI hesabı oluştur':'Veyra AI’ye giriş';$('#emailSubmit').textContent=reg?'Kayıt Ol':'Giriş Yap';$('#password').autocomplete=reg?'new-password':'current-password'}$('#loginTab').onclick=()=>setMode('login');$('#registerTab').onclick=()=>setMode('register');if(location.pathname==='/register')setMode('register');function saveSession(b){localStorage.setItem('veyra_session',JSON.stringify(b));location.href='/studio'}function show(msg,ok=false){$('#status').innerHTML='<span class="'+(ok?'ok':'err')+'">'+msg+'</span>'}async function emailAuth(){try{$('#status').textContent=mode==='register'?'Hesap oluşturuluyor...':'Giriş yapılıyor...';const r=await fetch('/api/auth-email',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:mode,email:$('#email').value.trim(),password:$('#password').value,displayName:$('#name').value.trim()})});const b=await r.json();if(!r.ok)throw new Error(({email_already_registered:'Bu e-posta zaten kayıtlı.',invalid_email_or_password:'E-posta veya şifre hatalı.',invalid_credentials_format:'Geçerli e-posta ve en az 8 karakter şifre gir.'})[b.error]||b.error||'İşlem başarısız');show(mode==='register'?'Hesabın oluşturuldu.':'Giriş başarılı.',true);setTimeout(()=>saveSession(b),350)}catch(e){show(e.message)}}$('#emailSubmit').onclick=emailAuth;function device(){let d=localStorage.getItem('veyra_device');if(!d){d=crypto.randomUUID()+crypto.randomUUID();localStorage.setItem('veyra_device',d)}return d}$('#guest').onclick=async()=>{try{$('#status').textContent='Misafir oturumu oluşturuluyor...';const r=await fetch('/api/auth-anonymous',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({deviceKey:device()})});const b=await r.json();if(!r.ok)throw new Error(b.error||'Misafir girişi başarısız');saveSession(b)}catch(e){show(e.message)}};async function firebaseSetup(){if(firebase)return firebase;const c=await fetch('/api/firebase-config').then(r=>r.json());if(!c.configured)throw new Error('Google/Apple girişi için Firebase web yapılandırması henüz production ortamına eklenmedi.');const appMod=await import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js');const authMod=await import('https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js');const app=appMod.initializeApp(c.config);firebase={auth:authMod.getAuth(app),mod:authMod};return firebase}async function social(kind){try{$('#status').textContent=(kind==='google'?'Google':'Apple')+' açılıyor...';const f=await firebaseSetup();const provider=kind==='google'?new f.mod.GoogleAuthProvider():new f.mod.OAuthProvider('apple.com');if(kind==='apple'){provider.addScope('email');provider.addScope('name')}const result=await f.mod.signInWithPopup(f.auth,provider);const idToken=await result.user.getIdToken(true);const r=await fetch('/api/auth-firebase',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({idToken})});const b=await r.json();if(!r.ok)throw new Error(b.error||'Sosyal giriş başarısız');saveSession(b)}catch(e){show(e.code==='auth/popup-closed-by-user'?'Giriş penceresi kapatıldı.':e.message)}}$('#google').onclick=()=>social('google');$('#apple').onclick=()=>social('apple');</script></body></html>
