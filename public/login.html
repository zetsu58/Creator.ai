<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veyra AI - Giriş</title><style>body{margin:0;font-family:system-ui;background:#090b10;color:#fff}*{box-sizing:border-box}a{color:inherit;text-decoration:none}.wrap{max-width:620px;margin:auto;padding:28px}.card{margin-top:70px;background:#12151d;border:1px solid #252a36;border-radius:22px;padding:28px}.btn{width:100%;padding:14px;border:0;border-radius:14px;background:#7c4dff;color:white;font-weight:800;cursor:pointer}.muted{color:#9aa2b2}.ok{color:#65e6a8}.err{color:#ff8181}</style></head><body><div class="wrap"><a href="/"><b>VEYRA AI</b></a><div class="card"><h1>Veyra Cloud’a giriş</h1><p class="muted">Bu sürüm güvenli cihaz oturumu oluşturur. Oturum tokenı yalnızca tarayıcında saklanır ve Veyra API isteklerinde kullanılır.</p><button id="login" class="btn">Güvenli oturum oluştur</button><p id="status" class="muted"></p></div></div><script>function device(){let d=localStorage.getItem('veyra_device');if(!d){d=crypto.randomUUID()+crypto.randomUUID();localStorage.setItem('veyra_device',d)}return d}document.querySelector('#login').onclick=async()=>{const s=document.querySelector('#status');try{s.textContent='Oturum oluşturuluyor...';const r=await fetch('/api/auth-anonymous',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({deviceKey:device()})});const b=await r.json();if(!r.ok)throw new Error(b.error||'Giriş başarısız');localStorage.setItem('veyra_session',JSON.stringify(b));s.innerHTML='<span class="ok">Oturum hazır. Studio açılıyor…</span>';setTimeout(()=>location.href='/studio',500)}catch(e){s.innerHTML='<span class="err">'+e.message+'</span>'}};</script></body></html>
