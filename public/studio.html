<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veyra Studio</title><style>body{margin:0;font-family:system-ui;background:#090b10;color:white}.wrap{max-width:900px;margin:auto;padding:24px}a{color:white;text-decoration:none}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#12151d;border:1px solid #252a36;border-radius:20px;padding:20px;margin-top:20px}textarea,input,select,button{width:100%;padding:13px;border-radius:12px;border:1px solid #303746;background:#0d1016;color:white;margin-top:10px}button{background:#7c4dff;font-weight:800;cursor:pointer}.tabs{display:flex;gap:8px}.tabs button{width:auto}.muted{color:#9aa2b2}.ok{color:#66e4a8}.err{color:#ff8181}img{max-width:100%;border-radius:16px;margin-top:12px}</style></head><body><div class="wrap"><div class="top"><a href="/"><b>VEYRA AI</b></a><a href="/dashboard">Videolarım</a></div><div class="card"><h1>AI Video Studio</h1><div class="tabs"><button id="textTab">Text → Video</button><button id="imageTab">Image → Video</button></div><div id="imageBox" style="display:none"><input id="file" type="file" accept="image/jpeg,image/png,image/webp"><img id="preview" style="display:none"></div><textarea id="prompt" rows="6" placeholder="Sahneyi detaylı anlat..."></textarea><select id="seconds"><option value="5">5 saniye</option><option value="10">10 saniye</option></select><select id="ratio"><option>16:9</option><option>9:16</option><option>1:1</option></select><button id="generate">Generate</button><div id="status" class="muted">Hazır</div></div></div><script>
let mode='text',selected=null,session=null;const $=s=>document.querySelector(s);function device(){let d=localStorage.getItem('veyra_device');if(!d){d=crypto.randomUUID()+crypto.randomUUID();localStorage.setItem('veyra_device',d)}return d}async function auth(){const old=localStorage.getItem('veyra_session');if(old){session=JSON.parse(old);return session}const r=await fetch('/api/auth-anonymous',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({deviceKey:device()})});if(!r.ok)throw new Error('Oturum oluşturulamadı');session=await r.json();localStorage.setItem('veyra_session',JSON.stringify(session));return session}function hdr(extra={}){return {authorization:'Bearer '+session.token,...extra}}$('#textTab').onclick=()=>{mode='text';$('#imageBox').style.display='none'};$('#imageTab').onclick=()=>{mode='image';$('#imageBox').style.display='block'};$('#file').onchange=e=>{selected=e.target.files[0];if(selected){$('#preview').src=URL.createObjectURL(selected);$('#preview').style.display='block'}};async function poll(id){for(let i=0;i<50;i++){await new Promise(r=>setTimeout(r,4000));const r=await fetch('/api/generation-status?id='+encodeURIComponent(id),{headers:hdr()});if(!r.ok)throw new Error('Durum alınamadı');const j=await r.json();$('#status').textContent='Durum: '+j.status;if(['completed','failed','refunded'].includes(j.status)){if(j.status==='completed'&&j.outputUrl){$('#status').innerHTML='<span class="ok">Video hazır.</span> <a href="'+j.outputUrl+'" target="_blank">Videoyu aç</a>'}return}}}$('#generate').onclick=async()=>{try{$('#status').textContent='Hazırlanıyor...';await auth();const prompt=$('#prompt').value.trim();if(prompt.length<3)throw new Error('Prompt yaz');let refs=[];if(mode==='image'){if(!selected)throw new Error('Önce bir görsel seç');const u=await fetch('/api/uploads/image',{method:'POST',headers:hdr({'x-veyra-user-id':session.userId,'content-type':selected.type,'content-length':String(selected.size)}),body:selected});if(!u.ok)throw new Error('Görsel yüklenemedi');refs=[(await u.json()).url]}const r=await fetch('/api/generations',{method:'POST',headers:hdr({'content-type':'application/json'}),body:JSON.stringify({userId:session.userId,type:'video',prompt,seconds:Number($('#seconds').value),quality:'fast',audio:false,aspectRatio:$('#ratio').value,references:refs})});const body=await r.json();if(!r.ok)throw new Error(body.message||body.error||'Generation başarısız');$('#status').textContent='Generation başladı';await poll(body.id)}catch(e){$('#status').innerHTML='<span class="err">'+e.message+'</span>'}};</script></body></html>
