<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veyra Videolarım</title><style>body{margin:0;font-family:system-ui;background:#090b10;color:#fff}.wrap{max-width:1000px;margin:auto;padding:24px}a{color:#fff}.grid{display:grid;gap:14px}.card{background:#12151d;border:1px solid #252a36;border-radius:18px;padding:18px}.muted{color:#9aa2b2}.ok{color:#68e5aa}.warn{color:#ffc76e}.bad{color:#ff8585}button{padding:10px 14px;border:0;border-radius:10px;background:#7c4dff;color:#fff;font-weight:800}</style></head><body><div class="wrap"><p><a href="/">← Veyra AI</a> · <a href="/studio">Studio</a></p><h1>Videolarım</h1><div id="status" class="muted">Yükleniyor…</div><div id="list" class="grid"></div></div><script>const $=s=>document.querySelector(s);async function load(){try{const raw=localStorage.getItem('veyra_session');if(!raw){$('#status').textContent='Henüz Veyra oturumu yok. Studio’dan üretim başlat.';return}const s=JSON.parse(raw);const r=await fetch('/api/user-generations?userId='+encodeURIComponent(s.userId),{headers:{authorization:'Bearer '+s.token}});if(r.status===401){localStorage.removeItem('veyra_session');throw new Error('Oturum süresi doldu. Studio’dan tekrar giriş yap.')}const b=await r.json();if(!r.ok)throw new Error(b.error||'Geçmiş alınamadı');const items=b.items||[];$('#status').textContent=items.length?items.length+' üretim bulundu':'Henüz üretim yok.';$('#list').innerHTML=items.map(x=>`<div class="card"><b>${x.type||'video'} · <span class="${x.status==='completed'?'ok':x.status==='refunded'?'warn':x.status==='failed'?'bad':''}">${x.status}</span></b><p>${(x.prompt||'').replace(/[<>]/g,'')}</p><div class="muted">${x.createdAt?new Date(x.createdAt).toLocaleString('tr-TR'):''}</div>${x.outputUrl?`<p><a href="${x.outputUrl}" target="_blank">▶ Videoyu aç</a></p>`:''}${x.status==='refunded'?'<p class="warn">Kredi otomatik iade edildi.</p>':''}</div>`).join('')}catch(e){$('#status').innerHTML='<span class="bad">'+e.message+'</span>'}}load();</script></body></html>
