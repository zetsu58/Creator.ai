<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veyra AI · Projelerim</title><link rel="stylesheet" href="/veyra.css"><script src="/consent.js" defer></script></head><body><header class="topbar"><div class="shell"><a class="brand" href="/">VEYRA <span>AI</span></a><nav class="nav"><a href="/studio">Studio</a><a class="active" href="/dashboard">Projelerim</a><a href="/pricing">Kredi Merkezi</a><a href="/profile">Profil</a></nav><div class="mobile-nav"><a href="/studio">Studio</a><a href="/profile">Profil</a></div></div></header><main class="page"><div class="shell"><div class="section-title"><div><div class="eyebrow">KİŞİSEL ÇALIŞMA ALANI</div><h1 style="margin-top:12px">Projelerim</h1><div class="muted">Tüm AI video üretimlerin hesabına özel burada saklanır.</div></div><a class="btn primary" href="/studio">+ Yeni video</a></div><div class="grid cols3" style="margin-bottom:18px"><div class="metric"><span class="muted">Toplam üretim</span><b id="total">0</b></div><div class="metric"><span class="muted">Tamamlanan</span><b id="completed">0</b></div><div class="metric"><span class="muted">Kredi iadesi</span><b id="refunded">0</b></div></div><div id="status" class="muted">Projeler yükleniyor…</div><div id="list" class="grid" style="margin-top:14px"></div></div></main><footer class="footer"><div class="shell">Veyra AI · Projeler yalnız hesabına bağlı güvenli session ile görüntülenir.</div></footer><script>const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const raw=localStorage.getItem('veyra_session');if(!raw){location.href='/login?next=/dashboard';return}const s=JSON.parse(raw);const r=await fetch('/api/user-generations?userId='+encodeURIComponent(s.userId),{headers:{authorization:'Bearer '+s.token}});if(r.status===401){localStorage.removeItem('veyra_session');location.href='/login?next=/dashboard';return}const b=await r.json();if(!r.ok)throw new Error(b.error||'Geçmiş alınamadı');const items=b.items||[];$('#total').textContent=items.length;$('#completed').textContent=items.filter(x=>x.status==='completed').length;$('#refunded').textContent=items.filter(x=>x.status==='refunded').length;$('#status').textContent=items.length?items.length+' proje bulundu':'Henüz proje yok.';$('#list').innerHTML=items.length?items.map(x=>`<article class="card project"><div><div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap"><b>${esc(x.type||'video')}</b><span class="status-pill" style="${x.status==='completed'?'':x.status==='refunded'?'background:#2a2415;color:#ffd17b':x.status==='failed'?'background:#2b171d;color:#ff98a6':'background:#171d2b;color:#9fb4ff'}">${esc(x.status||'')}</span></div><p class="muted">${esc(x.prompt||'')}</p><div class="meta">${x.createdAt?new Date(x.createdAt).toLocaleString('tr-TR'):''} · ${x.seconds||0} sn · ${esc(x.aspectRatio||'')}</div>${x.status==='refunded'?'<div class="warn" style="margin-top:8px">Kredi otomatik iade edildi.</div>':''}</div><div>${x.outputUrl?`<a class="btn secondary" href="${esc(x.outputUrl)}" target="_blank">▶ Videoyu Aç</a>`:'<span class="muted">İşleniyor</span>'}</div></article>`).join(''):'<div class="empty">Henüz üretimin yok. Studio’dan ilk videonu oluştur.</div>'}catch(e){$('#status').innerHTML='<span class="bad">'+esc(e.message)+'</span>'}}load();</script></body></html>
