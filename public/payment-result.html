<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veyra AI · Ödeme Sonucu</title><link rel="stylesheet" href="/veyra.css"><script src="/consent.js" defer></script><style>.result-shell{max-width:680px;margin:70px auto}.result-icon{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;font-size:34px;font-weight:900;background:linear-gradient(135deg,#efeaff,#e9fbff);margin-bottom:20px}.pulse{animation:pulse 1.4s infinite}@keyframes pulse{50%{transform:scale(.96);opacity:.7}}</style></head><body><header class="topbar"><div class="shell"><a class="brand" href="/">VEYRA <span>AI</span></a></div></header><main class="page"><div class="shell result-shell"><section class="card"><div id="icon" class="result-icon pulse">…</div><div class="eyebrow">ÖDEME DOĞRULAMA</div><h1 id="title">Ödeme sonucu kontrol ediliyor</h1><p id="message" class="muted">Yönlendirme sayfası tek başına ödeme onayı değildir. PayTR sunucu bildirimi doğrulanıyor.</p><div id="details" class="note" style="margin:18px 0">Lütfen bu sayfayı kapatma.</div><div class="actions" style="justify-content:flex-start"><a class="btn primary" href="/pricing">Kredi Merkezine Dön</a><a class="btn secondary" href="/studio">Studio’yu Aç</a></div></section></div></main><script>const q=new URLSearchParams(location.search),oid=q.get('oid')||'';let s;try{s=JSON.parse(localStorage.getItem('veyra_session')||'null')}catch{}const icon=document.querySelector('#icon'),title=document.querySelector('#title'),msg=document.querySelector('#message'),details=document.querySelector('#details');function done(kind,b){icon.classList.remove('pulse');if(kind==='ok'){icon.textContent='✓';title.textContent='Ödeme onaylandı';msg.textContent='Kredilerin hesabına güvenli şekilde eklendi.';details.innerHTML='<b>'+Number(b.creditsGranted||0)+' kredi eklendi.</b><br>Güncel bakiye: '+Number(b.credits||0)+' kredi.'}else if(kind==='fail'){icon.textContent='×';title.textContent='Ödeme tamamlanamadı';msg.textContent='Kartından başarılı tahsilat doğrulanmadı.';details.textContent=b?.message||'Kredi bakiyende değişiklik yapılmadı.'}else{icon.textContent='!';title.textContent='Ödeme bildirimi bekleniyor';msg.textContent='Bankadan dönüş geldi ancak güvenli sunucu bildirimi henüz tamamlanmadı.';details.textContent='Kısa süre sonra Kredi Merkezi’nden tekrar kontrol edebilirsin.'}}async function poll(){if(!s?.token||!oid){done('fail',{message:'Oturum veya sipariş bulunamadı.'});return}for(let i=0;i<25;i++){try{const r=await fetch('/api/wallet?action=web_status&merchantOid='+encodeURIComponent(oid),{headers:{authorization:'Bearer '+s.token}});const b=await r.json();if(r.ok&&b.status==='verified'){done('ok',b);return}if(r.ok&&['failed','revoked'].includes(b.status)){done('fail',b);return}}catch{}await new Promise(r=>setTimeout(r,1800))}done('pending',{})}poll()</script></body></html>
