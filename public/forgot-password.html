<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veyra AI · Şifre Sıfırla</title><link rel="stylesheet" href="/veyra.css"><script src="/consent.js" defer></script></head><body><header class="topbar"><div class="shell"><a class="brand" href="/">VEYRA <span>AI</span></a></div></header><main class="page"><div class="shell" style="max-width:620px"><section class="card"><div class="eyebrow">HESAP GÜVENLİĞİ</div><h1 id="title">Şifremi unuttum</h1><p id="desc" class="muted">Kayıtlı e-posta adresini gir. Sıfırlama bağlantısını e-postana göndereceğiz.</p><div id="requestBox"><label>E-posta adresi</label><input id="email" class="field" type="email" autocomplete="email"><button id="request" class="btn primary full" style="margin-top:14px">Sıfırlama bağlantısı gönder</button></div><div id="resetBox" style="display:none"><label>Yeni şifre</label><input id="password" class="field" type="password" autocomplete="new-password" placeholder="En az 8 karakter"><button id="reset" class="btn primary full" style="margin-top:14px">Yeni şifreyi kaydet</button></div><p id="status" class="tiny"></p><div class="divider"></div><a class="btn secondary full" href="/login">Giriş ekranına dön</a></section></div></main><script>const $=s=>document.querySelector(s);const token=new URLSearchParams(location.search).get('token');if(token){$('#title').textContent='Yeni şifre belirle';$('#desc').textContent='Yeni şifreni gir. Bu işlemden sonra mevcut oturumların kapatılır.';$('#requestBox').style.display='none';$('#resetBox').style.display='block'}function show(t,ok=false){$('#status').innerHTML='<span class="'+(ok?'ok':'bad')+'">'+t+'</span>'}$('#request').onclick=async()=>{try{$('#status').textContent='Gönderiliyor...';const r=await fetch('/api/password-reset',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:$('#email').value.trim()})});const b=await r.json();if(!r.ok){if(b.error==='email_delivery_not_configured')throw new Error('Şifre sıfırlama e-posta servisi yapılandırılmamış. Lütfen kısa süre sonra tekrar dene.');if(b.error==='email_delivery_failed')throw new Error('E-posta gönderim servisi şu anda yanıt vermiyor. Lütfen kısa süre sonra tekrar dene.');if(b.error==='password_managed_by_provider')throw new Error('Bu hesabın şifresi Google veya Apple tarafından yönetiliyor.');if(b.error==='invalid_email')throw new Error('Geçerli bir e-posta adresi gir.');throw new Error(b.error||'İşlem başarısız')}show('E-posta kayıtlıysa sıfırlama bağlantısı gönderildi.',true)}catch(e){show(e.message)}};$('#reset').onclick=async()=>{try{$('#status').textContent='Şifre güncelleniyor...';const r=await fetch('/api/password-reset',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,newPassword:$('#password').value})});const b=await r.json();if(!r.ok)throw new Error(b.error==='invalid_or_expired_token'?'Bağlantı geçersiz veya süresi dolmuş.':b.error==='invalid_new_password'?'Şifre en az 8 karakter olmalı.':b.error||'İşlem başarısız');show('Şifren değiştirildi. Giriş ekranına yönlendiriliyorsun.',true);setTimeout(()=>location.href='/login',900)}catch(e){show(e.message)}};</script></body></html>
