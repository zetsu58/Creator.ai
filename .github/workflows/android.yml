name: CreatorAI Android APK (Manual Only)

# Cost control: this workflow never runs on push or pull requests.
# Start it manually only when an APK is actually needed.
on:
  workflow_dispatch:

concurrency:
  group: creator-ai-manual-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Backend build
        run: cd backend && npm ci && npm run build
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Bootstrap Android
        run: flutter create --platforms=android --org ai.veyra --project-name creator_ai .
      - name: Configure Android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ['android/app/build.gradle.kts','android/app/build.gradle']:
              p=Path(name)
              if not p.exists(): continue
              s=p.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 24').replace('minSdkVersion flutter.minSdkVersion','minSdkVersion 24')
              s=re.sub(r'applicationId\s*=\s*"[^"]+"','applicationId = "ai.veyra.app"',s)
              s=re.sub(r'applicationId\s+"[^"]+"','applicationId "ai.veyra.app"',s)
              p.write_text(s)
          m=Path('android/app/src/main/AndroidManifest.xml');s=m.read_text();permission='<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in s:s=s.replace('<application',f'    {permission}\n\n    <application',1)
          s=s.replace('android:label="creator_ai"','android:label="Veyra AI"');m.write_text(s)
          PY
      - name: Flutter checks and APK
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
          flutter build apk --debug -t lib/main_auth.dart --dart-define=VEYRA_API_BASE_URL=https://veyra-ai-sigma.vercel.app
      - uses: actions/upload-artifact@v4
        with:
          name: veyra-ai-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3
