name: CreatorAI Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate backend TypeScript
        shell: bash
        run: |
          cd backend
          npm install
          npm run build
          test -f dist/server.js
          test -f dist/provider.js

      - name: Setup Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Bootstrap Android platform
        run: flutter create --platforms=android --org ai.veyra --project-name creator_ai .

      - name: Configure Android network and minSdk
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for name in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text()
              s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
              s = s.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 24')
              s = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "ai.veyra.app"', s)
              s = re.sub(r'applicationId\s+"[^"]+"', 'applicationId "ai.veyra.app"', s)
              p.write_text(s)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in s:
              s = s.replace('<application', f'    {permission}\n\n    <application', 1)
          s = s.replace('android:label="creator_ai"', 'android:label="Veyra AI"')
          manifest.write_text(s)
          PY
          grep -R "minSdk" android/app/build.gradle* || true
          grep -n "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml
          grep -R "ai.veyra.app" android/app/build.gradle* || true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Smoke tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug -t lib/main_auth.dart --dart-define=VEYRA_API_BASE_URL=https://veyra-ai-sigma.vercel.app

      - name: Verify APK
        shell: bash
        run: |
          test -f build/app/outputs/flutter-apk/app-debug.apk
          ls -lh build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veyra-ai-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
