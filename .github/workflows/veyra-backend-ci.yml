name: Veyra Cloud Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/veyra-backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/veyra-backend-ci.yml'

jobs:
  backend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: TypeScript build
        working-directory: backend
        run: npm run build

      - name: Verify v2 output
        working-directory: backend
        run: test -f dist/index_v2.js
