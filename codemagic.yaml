workflows:
  creatorai_android:
    name: Veyra AI Android APK
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.7
    scripts:
      - name: Source revision
        script: |
          git rev-parse HEAD
          git log -1 --oneline
          sed -n '1,80p' test/widget_test.dart
      - name: Bootstrap Android
        script: |
          flutter create --platforms=android --org ai.veyra --project-name creator_ai .
      - name: Configure Veyra Android
        script: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['android/app/build.gradle.kts','android/app/build.gradle']:
              p=Path(name)
              if p.exists():
                  s=p.read_text()
                  s=s.replace('minSdk = flutter.minSdkVersion','minSdk = 24')
                  s=s.replace('minSdkVersion flutter.minSdkVersion','minSdkVersion 24')
                  p.write_text(s)
          p=Path('android/app/src/main/AndroidManifest.xml')
          if p.exists():
              s=p.read_text().replace('android:label="creator_ai"','android:label="Veyra AI"')
              p.write_text(s)
          PY
      - name: Install dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze --no-fatal-infos
      - name: Test
        script: flutter test
      - name: Build Android debug APK
        script: flutter build apk --debug
      - name: Verify APK
        script: |
          test -f build/app/outputs/flutter-apk/app-debug.apk
          shasum -a 256 build/app/outputs/flutter-apk/app-debug.apk
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

  creatorai_web:
    name: Veyra AI Web
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.7
    scripts:
      - name: Source revision
        script: |
          git rev-parse HEAD
          git log -1 --oneline
      - name: Bootstrap Web
        script: flutter create --platforms=web --org ai.veyra --project-name creator_ai .
      - name: Configure Veyra Web
        script: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/index.html')
          if p.exists():
              s=p.read_text().replace('<title>creator_ai</title>','<title>Veyra AI</title>')
              p.write_text(s)
          p=Path('web/manifest.json')
          if p.exists():
              s=p.read_text().replace('"name": "creator_ai"','"name": "Veyra AI"').replace('"short_name": "creator_ai"','"short_name": "Veyra AI"')
              p.write_text(s)
          PY
      - name: Install dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze --no-fatal-infos
      - name: Test
        script: flutter test
      - name: Build Web release
        script: flutter build web --release
    artifacts:
      - build/web/**

  creatorai_ios_simulator:
    name: Veyra AI iOS Simulator
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.7
      xcode: latest
      cocoapods: default
    scripts:
      - name: Source revision
        script: |
          git rev-parse HEAD
          git log -1 --oneline
      - name: Bootstrap iOS
        script: flutter create --platforms=ios --org ai.veyra --project-name creator_ai .
      - name: Configure Veyra iOS
        script: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ios/Runner/Info.plist')
          if p.exists():
              s=p.read_text().replace('<string>creator_ai</string>','<string>Veyra AI</string>')
              p.write_text(s)
          PY
      - name: Install dependencies
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..
      - name: Analyze
        script: flutter analyze --no-fatal-infos
      - name: Test
        script: flutter test
      - name: Build iOS simulator app
        script: flutter build ios --simulator --debug --no-codesign
    artifacts:
      - build/ios/iphonesimulator/*.app/**
