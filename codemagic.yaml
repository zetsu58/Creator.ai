workflows:
  creatorai_android:
    name: CreatorAI Android APK
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.7
    scripts:
      - name: Bootstrap Android
        script: |
          flutter create --platforms=android --org ai.creator --project-name creator_ai .
      - name: Set Android min SDK
        script: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['android/app/build.gradle.kts','android/app/build.gradle']:
              p=Path(name)
              if p.exists():
                  s=p.read_text()
                  s=s.replace('minSdk = flutter.minSdkVersion','minSdk = 24')
                  s=s.replace('minSdkVersion flutter.minSdkVersion','minSdkVersion 24')
                  p.write_text(s)
          PY
      - name: Install dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze --no-fatal-infos
      - name: Test
        script: flutter test
      - name: Build Android debug APK
        script: flutter build apk --debug
      - name: Verify APK
        script: |
          test -f build/app/outputs/flutter-apk/app-debug.apk
          shasum -a 256 build/app/outputs/flutter-apk/app-debug.apk
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

  creatorai_web:
    name: CreatorAI Web
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.7
    scripts:
      - name: Bootstrap Web
        script: flutter create --platforms=web --org ai.creator --project-name creator_ai .
      - name: Install dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze --no-fatal-infos
      - name: Test
        script: flutter test
      - name: Build Web release
        script: flutter build web --release
    artifacts:
      - build/web/**

  creatorai_ios_simulator:
    name: CreatorAI iOS Simulator
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.7
      xcode: latest
      cocoapods: default
    scripts:
      - name: Bootstrap iOS
        script: flutter create --platforms=ios --org ai.creator --project-name creator_ai .
      - name: Install dependencies
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..
      - name: Analyze
        script: flutter analyze --no-fatal-infos
      - name: Test
        script: flutter test
      - name: Build iOS simulator app
        script: flutter build ios --simulator --debug --no-codesign
    artifacts:
      - build/ios/iphonesimulator/*.app/**
