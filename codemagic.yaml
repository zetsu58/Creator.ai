workflows:
  creatorai_android:
    name: Veyra AI Android APK
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.7
    scripts:
      - name: Source revision
        script: |
          git rev-parse HEAD
          git log -1 --oneline
          sed -n '1,120p' test/widget_test.dart
      - name: Verify Veyra Cloud backend v2
        script: |
          node --version
          npm --version
          cd backend
          npm install
          npm run build
          test -f dist/index_v2.js
      - name: Bootstrap Android
        script: flutter create --platforms=android --org ai.veyra --project-name creator_ai .
      - name: Configure Veyra Android API 36
        script: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          for name in ['android/app/build.gradle.kts','android/app/build.gradle']:
              p=Path(name)
              if not p.exists(): continue
              s=p.read_text()
              s=s.replace('compileSdk = flutter.compileSdkVersion','compileSdk = 36')
              s=s.replace('compileSdkVersion flutter.compileSdkVersion','compileSdkVersion 36')
              s=s.replace('targetSdk = flutter.targetSdkVersion','targetSdk = 36')
              s=s.replace('targetSdkVersion flutter.targetSdkVersion','targetSdkVersion 36')
              s=s.replace('minSdk = flutter.minSdkVersion','minSdk = 24')
              s=s.replace('minSdkVersion flutter.minSdkVersion','minSdkVersion 24')
              s=re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "ai.veyra.app"', s)
              s=re.sub(r'applicationId\s+"[^"]+"', 'applicationId "ai.veyra.app"', s)
              p.write_text(s)
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          if manifest.exists():
              s=manifest.read_text().replace('android:label="creator_ai"','android:label="Veyra AI"')
              app_id=os.getenv('ADMOB_ANDROID_APP_ID','ca-app-pub-3940256099942544~3347511713')
              if 'com.google.android.gms.ads.APPLICATION_ID' not in s:
                  s=s.replace('</application>', f'''\n        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="{app_id}" />\n    </application>''')
              manifest.write_text(s)
          values=Path('android/app/src/main/res/values'); values.mkdir(parents=True, exist_ok=True)
          (values/'colors.xml').write_text('''<?xml version="1.0" encoding="utf-8"?><resources><color name="veyra_icon_bg">#090B12</color></resources>''')
          drawable=Path('android/app/src/main/res/drawable'); drawable.mkdir(parents=True, exist_ok=True)
          (drawable/'ic_veyra_foreground.xml').write_text('''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#8B5CF6" android:pathData="M22,20 L44,20 L54,47 L64,20 L86,20 L62,79 L46,79 Z"/><path android:fillColor="#55D6FF" android:pathData="M54,47 L64,20 L86,20 L62,79 Z"/><path android:fillColor="#FFD76A" android:pathData="M79,18 L82,25 L89,28 L82,31 L79,38 L76,31 L69,28 L76,25 Z"/></vector>''')
          v26=Path('android/app/src/main/res/mipmap-anydpi-v26'); v26.mkdir(parents=True, exist_ok=True)
          (v26/'ic_launcher.xml').write_text('''<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/veyra_icon_bg"/><foreground android:drawable="@drawable/ic_veyra_foreground"/></adaptive-icon>''')
          (v26/'ic_launcher_round.xml').write_text('''<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/veyra_icon_bg"/><foreground android:drawable="@drawable/ic_veyra_foreground"/></adaptive-icon>''')
          legacy=Path('android/app/src/main/res/mipmap-anydpi')
          for filename in ['ic_launcher.xml','ic_launcher_round.xml']:
              f=legacy/filename
              if f.exists(): f.unlink()
          PY
      - name: Verify Android release prerequisites
        script: |
          grep -R "compileSdk = 36\|compileSdkVersion 36" android/app/build.gradle* || true
          grep -R "targetSdk = 36\|targetSdkVersion 36" android/app/build.gradle* || true
          grep -R "ai.veyra.app" android/app/build.gradle* || true
          grep -n "com.google.android.gms.ads.APPLICATION_ID" android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f lib/main_auth.dart
          if [ -n "${VEYRA_API_BASE_URL:-}" ]; then echo "Veyra Cloud URL configured"; else echo "Veyra Cloud URL is NOT configured"; fi
          echo "Firebase enabled: ${VEYRA_FIREBASE_ENABLED:-false}"
      - name: Install dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze --no-fatal-infos
      - name: Test
        script: flutter test
      - name: Build Android debug APK
        script: |
          EXTRA=""
          if [ -n "${VEYRA_API_BASE_URL:-}" ]; then EXTRA="$EXTRA --dart-define=VEYRA_API_BASE_URL=$VEYRA_API_BASE_URL"; fi
          if [ "${VEYRA_FIREBASE_ENABLED:-false}" = "true" ]; then EXTRA="$EXTRA --dart-define=VEYRA_FIREBASE_ENABLED=true"; fi
          flutter build apk --debug -t lib/main_auth.dart $EXTRA
      - name: Verify APK
        script: |
          test -f build/app/outputs/flutter-apk/app-debug.apk
          shasum -a 256 build/app/outputs/flutter-apk/app-debug.apk
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

  veyra_android_aab_rc:
    name: Veyra AI Android AAB RC
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.7
    scripts:
      - name: Verify Veyra Cloud backend v2
        script: |
          cd backend
          npm install
          npm run build
          test -f dist/index_v2.js
      - name: Bootstrap Android
        script: flutter create --platforms=android --org ai.veyra --project-name creator_ai .
      - name: Configure API 36 release candidate
        script: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p=Path('android/app/build.gradle.kts') if Path('android/app/build.gradle.kts').exists() else Path('android/app/build.gradle')
          s=p.read_text()
          s=s.replace('compileSdk = flutter.compileSdkVersion','compileSdk = 36').replace('compileSdkVersion flutter.compileSdkVersion','compileSdkVersion 36')
          s=s.replace('targetSdk = flutter.targetSdkVersion','targetSdk = 36').replace('targetSdkVersion flutter.targetSdkVersion','targetSdkVersion 36')
          s=s.replace('minSdk = flutter.minSdkVersion','minSdk = 24').replace('minSdkVersion flutter.minSdkVersion','minSdkVersion 24')
          s=re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "ai.veyra.app"', s)
          s=re.sub(r'applicationId\s+"[^"]+"', 'applicationId "ai.veyra.app"', s)
          p.write_text(s)
          m=Path('android/app/src/main/AndroidManifest.xml')
          ms=m.read_text().replace('android:label="creator_ai"','android:label="Veyra AI"')
          aid=os.getenv('ADMOB_ANDROID_APP_ID','ca-app-pub-3940256099942544~3347511713')
          if 'com.google.android.gms.ads.APPLICATION_ID' not in ms:
              ms=ms.replace('</application>', f'<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="{aid}" /></application>')
          m.write_text(ms)
          PY
      - name: Require production Cloud URL
        script: |
          test -n "${VEYRA_API_BASE_URL:-}" || (echo "VEYRA_API_BASE_URL is required for AAB release candidate" && exit 1)
      - name: Install dependencies
        script: flutter pub get
      - name: Analyze and test
        script: |
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build release candidate AAB
        script: |
          EXTRA="--dart-define=VEYRA_API_BASE_URL=$VEYRA_API_BASE_URL"
          if [ "${VEYRA_FIREBASE_ENABLED:-false}" = "true" ]; then EXTRA="$EXTRA --dart-define=VEYRA_FIREBASE_ENABLED=true"; fi
          flutter build appbundle --release -t lib/main_auth.dart $EXTRA
      - name: Verify AAB
        script: |
          test -f build/app/outputs/bundle/release/app-release.aab
          shasum -a 256 build/app/outputs/bundle/release/app-release.aab
          echo "NOTE: RC AAB is for validation. Production Play signing configuration must be completed in Play Console/Codemagic before submission."
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab

  creatorai_web:
    name: Veyra AI Web
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.7
    scripts:
      - name: Bootstrap Web
        script: flutter create --platforms=web --org ai.veyra --project-name creator_ai .
      - name: Configure Veyra Web
        script: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/index.html')
          if p.exists(): p.write_text(p.read_text().replace('<title>creator_ai</title>','<title>Veyra AI</title>'))
          p=Path('web/manifest.json')
          if p.exists(): p.write_text(p.read_text().replace('"name": "creator_ai"','"name": "Veyra AI"').replace('"short_name": "creator_ai"','"short_name": "Veyra AI"'))
          PY
      - name: Install dependencies
        script: flutter pub get
      - name: Analyze and test
        script: |
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build Web release
        script: |
          EXTRA=""
          if [ -n "${VEYRA_API_BASE_URL:-}" ]; then EXTRA="$EXTRA --dart-define=VEYRA_API_BASE_URL=$VEYRA_API_BASE_URL"; fi
          if [ "${VEYRA_FIREBASE_ENABLED:-false}" = "true" ]; then EXTRA="$EXTRA --dart-define=VEYRA_FIREBASE_ENABLED=true"; fi
          flutter build web --release -t lib/main_auth.dart $EXTRA
    artifacts:
      - build/web/**

  creatorai_ios_simulator:
    name: Veyra AI iOS Simulator
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.7
      xcode: latest
      cocoapods: default
    scripts:
      - name: Bootstrap iOS
        script: flutter create --platforms=ios --org ai.veyra --project-name creator_ai .
      - name: Configure Veyra iOS
        script: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path('ios/Runner/Info.plist')
          if p.exists():
              s=p.read_text().replace('<string>creator_ai</string>','<string>Veyra AI</string>')
              app_id=os.getenv('ADMOB_IOS_APP_ID','ca-app-pub-3940256099942544~1458002511')
              if 'GADApplicationIdentifier' not in s:
                  s=s.replace('</dict>', f'\n\t<key>GADApplicationIdentifier</key>\n\t<string>{app_id}</string>\n</dict>')
              p.write_text(s)
          PY
      - name: Install dependencies
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios && pod install && cd ..
      - name: Analyze and test
        script: |
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build iOS simulator app
        script: |
          EXTRA=""
          if [ -n "${VEYRA_API_BASE_URL:-}" ]; then EXTRA="$EXTRA --dart-define=VEYRA_API_BASE_URL=$VEYRA_API_BASE_URL"; fi
          if [ "${VEYRA_FIREBASE_ENABLED:-false}" = "true" ]; then EXTRA="$EXTRA --dart-define=VEYRA_FIREBASE_ENABLED=true"; fi
          flutter build ios --simulator --debug --no-codesign -t lib/main_auth.dart $EXTRA
    artifacts:
      - build/ios/iphonesimulator/*.app/**
