workflows:
  creatorai_multiplatform:
    name: CreatorAI Android iOS Web
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.7
      xcode: latest
      cocoapods: default
      vars:
        APP_NAME: CreatorAI
    scripts:
      - name: Flutter version
        script: |
          flutter --version
          dart --version
      - name: Bootstrap platforms
        script: |
          flutter create --platforms=android,ios,web --org ai.creator --project-name creator_ai .
      - name: Set Android min SDK
        script: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          if p.exists():
              s=p.read_text()
              s=s.replace('minSdk = flutter.minSdkVersion','minSdk = 24')
              p.write_text(s)
          p=Path('android/app/build.gradle')
          if p.exists():
              s=p.read_text()
              s=s.replace('minSdkVersion flutter.minSdkVersion','minSdkVersion 24')
              p.write_text(s)
          PY
      - name: Install dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze --no-fatal-infos
      - name: Test
        script: flutter test
      - name: Build Android debug APK
        script: flutter build apk --debug
      - name: Build Web release
        script: flutter build web --release
      - name: Build iOS simulator app
        script: flutter build ios --simulator --debug --no-codesign
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
      - build/web/**
      - build/ios/iphonesimulator/*.app/**
    publishing:
      email:
        recipients: []
        notify:
          success: false
          failure: false
