services:
  - type: web
    name: veyra-cloud-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: NODE_ENV
        value: production
      - key: VEYRA_REQUIRE_AUTH
        value: true
      - key: VEYRA_ADMIN_TOKEN
        generateValue: true
      - key: VEYRA_SESSION_SECRET
        generateValue: true
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: AI_PROVIDER_PRIMARY
        value: mock
      - key: AI_PROVIDER_FALLBACK
        value: mock
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: REPLICATE_VIDEO_MODEL
        sync: false
      - key: REPLICATE_IMAGE_MODEL
        sync: false
      - key: REPLICATE_PROMPT_FIELD
        value: prompt
      - key: REPLICATE_ASPECT_RATIO_FIELD
        value: aspect_ratio
      - key: REPLICATE_DURATION_FIELD
        value: duration
      - key: REPLICATE_AUDIO_FIELD
        value: generate_audio
      - key: DATABASE_URL
        fromDatabase:
          name: veyra-postgres
          property: connectionString

databases:
  - name: veyra-postgres
    databaseName: veyra
    user: veyra
